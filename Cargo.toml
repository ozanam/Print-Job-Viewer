[package]
name = "printfileviewer"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui_extras = { version = "0.29", default-features = false }
epaint_default_fonts = "0.29"
flate2 = "1"
jpeg-decoder = "0.3"
png = "0.17"
rfd = "0.15"
tiny-skia = "0.11"
ttf-parser = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
embed-resource = "3.0.12"
